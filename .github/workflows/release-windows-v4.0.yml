name: Publish liNi 4.0 for Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows-v4.0.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-v4.0-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish the Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-v4.0'
          $installer = 'windows/downloads/liNi-Setup-Windows-x64.exe'
          $checksum = 'windows/downloads/SHA256SUMS.txt'
          $version = (Get-Item -LiteralPath $installer).VersionInfo.FileVersion
          if ($version -ne '4.0.0.0') { throw "Unexpected installer version: $version" }
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Installer checksum differs from the published checksum' }

          gh release create $tag $installer $checksum --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'liNi 4.0 for Windows' --notes-file windows/RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release' }

          $download = Join-Path $env:RUNNER_TEMP 'lini-v4-verify'
          New-Item -ItemType Directory -Path $download | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $download --pattern 'liNi-Setup-Windows-x64.exe' --pattern 'SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the draft assets for verification' }
          $uploaded = (Get-FileHash -LiteralPath (Join-Path $download 'liNi-Setup-Windows-x64.exe') -Algorithm SHA256).Hash
          $publishedChecksum = ((Get-Content -LiteralPath (Join-Path $download 'SHA256SUMS.txt') -Raw).Trim() -split '\s+')[0]
          if ($uploaded -ne $expected -or $publishedChecksum -ne $expected) { throw 'Uploaded assets failed checksum verification' }

          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified draft release' }
