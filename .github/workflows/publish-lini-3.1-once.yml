name: Publish liNi 3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-lini-3.1-once.yml'

permissions: {}

jobs:
  release:
    if: github.repository == 'UjanGuin/ZYLO-SYSTEM-COMMAND-DESKLET' && github.event.before == 'ec774d3df3d15593f9a58291dac5da5c63e3199c'
    runs-on: windows-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and publish liNi 3.1
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'windows-v3.1'
          $fileName = 'liNi-Setup-Windows-x64.exe'
          $installer = (Resolve-Path "windows/downloads/$fileName").Path
          $expected = 'f7d5c79cf18e81e371e0c6e59bb677b3fa5fbff5073adb4cac03222467769d4e'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'Unexpected installer checksum.'
          }
          if ([System.Reflection.AssemblyName]::GetAssemblyName($installer).Version.ToString() -ne '3.1.0.0') {
            throw 'Unexpected installer version.'
          }
          gh release create $tag $installer ./windows/downloads/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target 'ec774d3df3d15593f9a58291dac5da5c63e3199c' --title 'liNi 3.1 for Windows' --notes-file ./windows/RELEASE-NOTES.md --draft
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          $staging = Join-Path $env:RUNNER_TEMP 'lini-3.1-verify'
          New-Item -ItemType Directory -Path $staging | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir $staging --pattern $fileName
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the uploaded installer.' }
          if ((Get-FileHash -LiteralPath (Join-Path $staging $fileName) -Algorithm SHA256).Hash -ne $expected) {
            throw 'Uploaded installer checksum differs.'
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release.' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isDraft,tagName,assets
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify the published release.' }
